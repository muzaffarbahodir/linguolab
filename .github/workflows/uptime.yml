# Внешний uptime-мониторинг: GitHub Actions пингует прод каждые ~30 минут.
# ВАЖНО: репозиторий приватный — каждый ран биллится минимум как 1 минута из
# бесплатных 2000 мин/мес. */5 сжёг бы ~8600 мин/мес и остановил бы ВСЕ Actions
# включая деплой; */30 ≈ 1440 мин/мес — влезает вместе с деплоями.
# Для 5-минутных проверок лучше бесплатный UptimeRobot (внешний сервис).
# Sentry ловит ошибки приложения, но молчит, если сервер лёг целиком — этот
# workflow живёт вне сервера и закрывает эту дыру.
#
# Алерт в Telegram: добавьте в Settings → Secrets and variables → Actions:
#   TG_ALERT_BOT_TOKEN — токен бота (можно основного)
#   TG_ALERT_CHAT_ID   — chat_id владельца (личка с ботом)
# Без секретов workflow просто краснеет в Actions (тоже сигнал — GitHub шлёт email).
name: Uptime

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API health
        id: api
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            https://api-linguolab.muzaffarbahodir.uz/health)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "200" ]

      - name: Check web app
        id: web
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            https://app-linguolab.muzaffarbahodir.uz/)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "200" ]

      - name: Telegram alert on failure
        if: steps.api.outcome == 'failure' || steps.web.outcome == 'failure'
        env:
          TOKEN: ${{ secrets.TG_ALERT_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_ALERT_CHAT_ID }}
        run: |
          [ -z "$TOKEN" ] && { echo "TG_ALERT_BOT_TOKEN not set — skipping TG alert"; exit 0; }
          msg="🔴 LinguoLab DOWN
          API: ${{ steps.api.outputs.code }} | Web: ${{ steps.web.outputs.code }}
          $(date -u '+%Y-%m-%d %H:%M UTC')"
          curl -s --max-time 15 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" --data-urlencode text="$msg" > /dev/null

      - name: Fail the run if anything is down
        if: steps.api.outcome == 'failure' || steps.web.outcome == 'failure'
        run: exit 1
